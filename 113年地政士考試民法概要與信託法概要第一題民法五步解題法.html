理解法律制度存在的目的。這是一切邏輯的起點。`,layout:"center"},{id:6,content:"為什麼法律允許被詐欺者撤銷？因為這關乎意思表示的自由與交易的公平。",layout:"top"},{id:7,content:`STEP 2｜我來設計
假設你是立法者，你會把風險分給誰？是不知情的本人，還是無辜的賣方？`,layout:"left"},{id:8,content:"方案 B：代理人是本人的延伸。本人享有利益，就應承擔代理人帶來的風險。",layout:"center"},{id:9,content:`STEP 3｜白話翻譯
把乾枯的法條變成四幕生活劇場，讓故事動起來。`,layout:"bottom"},{id:10,content:"第一幕：甲派出代理人乙。代理權限內，乙就是甲的化身。（民法§103）",layout:"left-top"},{id:11,content:"第二幕：乙欺騙了丙。雖然甲不知情，但乙是甲的「延伸」而非第三人。（民法§92）",layout:"right"},{id:12,content:"第三幕：丙依法撤銷。當丙發現真相，原本的買賣契約與移轉行為，全部歸於無效。",layout:"center"},{id:13,content:"第四幕：丙要回土地。身為真正所有權人，丙有權要求甲塗銷登記並返還土地。",layout:"bottom"},{id:14,content:"關鍵法條：§767 I。前返還、中除去、後防止。塗銷登記就是除去妨害。",layout:"right"},{id:15,content:`STEP 4｜關書輸出
挑戰最難的一步：蓋上書，在 20 分鐘內寫出完整申論答案。`,layout:"center"},{id:16,content:"01 先寫法律關係：按民法 §103，交代甲乙丙的法律紐帶。",layout:"left-bottom"},{id:17,content:"02 再寫爭點：代理人乙是否屬 §92 I 但書的「第三人」？這是本題勝負手。",layout:"center"},{id:18,content:"03 進行涵攝與結論：連結法規與事實，給出最終的正義判斷。",layout:"right-bottom"},{id:19,content:`STEP 5｜間隔回想
別死記硬背。用 14 天的節奏，把知識刻進大腦裡。`,layout:"top"},{id:20,content:"第 0 天：建立理解。第 1 天：閉書口述。第 3 天：骨架默寫。",layout:"center"},{id:21,content:"第 7 天：限時演練。第 14 天：變化題測試。唯有主動回想，才能穩定輸出。",layout:"bottom"},{id:22,content:"留香的速記字卡：正面寫「代理詐欺」，背面寫「撤銷 + §767」。",layout:"center"},{id:23,content:"考試節奏：90 分鐘四題。第一題請控制在 21 分鐘內，絕不戀戰。",layout:"left"},{id:24,content:"忘記條號時怎麼辦？寫出法律原則。別被數字困住，邏輯才是靈魂。",layout:"center"},{id:25,content:"每日 60 分鐘修練清單：8 分鐘為什麼、10 分鐘我設計、10 分鐘白話譯...",layout:"bottom"},{id:26,content:"22 分鐘關書輸出。這是最痛苦卻也最有成長的 22 分鐘。",layout:"center"},{id:27,content:"最後 10 分鐘間隔回想。訂正錯誤，是為了下一次不再犯錯。",layout:"right"},{id:28,content:"地政士申論不是比賽背誦，而是要把法條轉化為解決問題的推理。",layout:"top"},{id:29,content:"只要每練一題，都留下「爭點、法條、涵攝、結論」的足跡。",layout:"bottom"},{id:30,content:"我是染谷留香。這是我通往夢想的軌跡，現在，換你開始了。",layout:"center",isFinal:!0}];function k0(e){switch(e){case"cover":return"justify-center items-center text-center";case"top":return"justify-start items-center pt-[10%] text-center";case"bottom":return"justify-end items-center pb-[12%] text-center";case"left":return"justify-center items-start pl-[8%] pr-[42%] text-left";case"right":return"justify-center items-end pr-[8%] pl-[42%] text-right";case"center":return"justify-center items-center text-center";case"center-left":return"justify-center items-start pl-[10%] pr-[38%] text-left";case"right-bottom":return"justify-end items-end pb-[10%] pr-[8%] pl-[36%] text-right";case"left-bottom":return"justify-end items-start pb-[10%] pl-[8%] pr-[36%] text-left";case"left-top":return"justify-start items-start pt-[10%] pl-[8%] pr-[38%] text-left";default:return"justify-center items-center text-center"}}function S0(e){let n={1:{pos:"right-[-6%] bottom-[-5%] w-[68%] opacity-95",filter:"saturate(1.05) contrast(1.02)",blend:"normal"},2:{pos:"right-[2%] bottom-[-8%] w-[62%] opacity-90",filter:"saturate(0.95) brightness(0.98)",blend:"multiply"},3:{pos:"right-[-2%] bottom-[-4%] w-[66%] opacity-92",filter:"brightness(1.05)",blend:"normal"},4:{pos:"left-[8%] bottom-[5%] w-[38%] opacity-40",filter:"blur(
